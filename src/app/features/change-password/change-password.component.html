<section class="mx-auto w-full max-w-xl px-4 py-5 font-sans">
  <article
    class="overflow-hidden rounded-3xl border border-slate-200/70 bg-white shadow-[0_1px_2px_rgba(15,23,42,0.05),0_4px_16px_rgba(15,23,42,0.04)]"
  >
    <!-- Header -->
    <header class="flex items-center gap-3.5 border-b border-slate-100 p-5 sm:p-6">
      <span
        class="flex size-12 shrink-0 items-center justify-center rounded-2xl bg-gradient-to-br from-[#00298a] to-blue-500 text-white shadow-lg shadow-[#00298a]/25"
      >
        <i class="fa-solid fa-key text-lg"></i>
      </span>
      <div class="min-w-0">
        <h1 class="text-xl font-extrabold tracking-tight text-slate-900 rtl:tracking-normal">
          Change password
        </h1>
        <p class="mt-0.5 text-sm leading-6 text-slate-500">
          Use a strong password you don't use anywhere else.
        </p>
      </div>
    </header>

    <form class="space-y-4 p-5 sm:p-6" autocomplete="off">
      <!-- Current password -->
      <div>
        <label for="current-password" class="mb-1.5 block text-sm font-semibold text-slate-700">
          Current password
        </label>
        <div class="group relative">
          <div
            class="pointer-events-none absolute inset-y-0 start-0 flex items-center ps-4 text-slate-400 transition-colors group-focus-within:text-[#00298a]"
          >
            <i class="fa-solid fa-lock text-sm"></i>
          </div>
          <input
            type="password"
            id="current-password"
            placeholder="Enter your current password"
            class="block h-[46px] w-full rounded-xl border border-slate-200 bg-slate-50 ps-12 pe-12 text-sm text-slate-900 placeholder-slate-400 shadow-[0_1px_2px_rgba(15,23,42,0.03)] transition-all duration-200 hover:border-slate-300 focus:border-[#00298a] focus:bg-white focus:ring-4 focus:ring-[#00298a]/10 focus:outline-none"
          />
          <button
            type="button"
            aria-label="Show password"
            class="absolute inset-y-0 end-0 flex w-12 cursor-pointer items-center justify-center text-slate-400 transition-colors hover:text-[#00298a] focus:outline-none focus-visible:text-[#00298a]"
          >
            <i class="fa-regular fa-eye text-sm"></i>
          </button>
        </div>
      </div>

      <!-- New password -->
      <div>
        <label for="new-password" class="mb-1.5 block text-sm font-semibold text-slate-700">
          New password
        </label>
        <div class="group relative">
          <div
            class="pointer-events-none absolute inset-y-0 start-0 flex items-center ps-4 text-slate-400 transition-colors group-focus-within:text-[#00298a]"
          >
            <i class="fa-solid fa-key text-sm"></i>
          </div>
          <input
            type="password"
            id="new-password"
            placeholder="Create a new password"
            class="block h-[46px] w-full rounded-xl border border-slate-200 bg-slate-50 ps-12 pe-12 text-sm text-slate-900 placeholder-slate-400 shadow-[0_1px_2px_rgba(15,23,42,0.03)] transition-all duration-200 hover:border-slate-300 focus:border-[#00298a] focus:bg-white focus:ring-4 focus:ring-[#00298a]/10 focus:outline-none"
          />
          <button
            type="button"
            aria-label="Show password"
            class="absolute inset-y-0 end-0 flex w-12 cursor-pointer items-center justify-center text-slate-400 transition-colors hover:text-[#00298a] focus:outline-none focus-visible:text-[#00298a]"
          >
            <i class="fa-regular fa-eye text-sm"></i>
          </button>
        </div>

        <!-- Strength meter -->
        <div class="mt-2.5">
          <div class="flex gap-1.5" aria-hidden="true">
            <span class="h-1.5 flex-1 rounded-full bg-emerald-500"></span>
            <span class="h-1.5 flex-1 rounded-full bg-emerald-500"></span>
            <span class="h-1.5 flex-1 rounded-full bg-slate-200"></span>
            <span class="h-1.5 flex-1 rounded-full bg-slate-200"></span>
          </div>
          <p class="mt-1.5 text-xs font-semibold text-emerald-600">Good strength</p>
        </div>
      </div>

      <!-- Requirements -->
      <ul
        class="grid grid-cols-1 gap-2 rounded-2xl border border-slate-200/80 bg-slate-50 p-3.5 text-xs font-medium sm:grid-cols-2"
      >
        <li class="flex items-center gap-2 text-emerald-600">
          <i class="fa-solid fa-circle-check"></i> At least 8 characters
        </li>
        <li class="flex items-center gap-2 text-emerald-600">
          <i class="fa-solid fa-circle-check"></i> One uppercase letter
        </li>
        <li class="flex items-center gap-2 text-slate-400">
          <i class="fa-regular fa-circle"></i> One number
        </li>
        <li class="flex items-center gap-2 text-slate-400">
          <i class="fa-regular fa-circle"></i> One special character
        </li>
      </ul>

      <!-- Confirm password -->
      <div>
        <label for="confirm-new-password" class="mb-1.5 block text-sm font-semibold text-slate-700">
          Confirm new password
        </label>
        <div class="group relative">
          <div
            class="pointer-events-none absolute inset-y-0 start-0 flex items-center ps-4 text-slate-400 transition-colors group-focus-within:text-[#00298a]"
          >
            <i class="fa-solid fa-shield-halved text-sm"></i>
          </div>
          <input
            type="password"
            id="confirm-new-password"
            placeholder="Re-enter your new password"
            class="block h-[46px] w-full rounded-xl border border-slate-200 bg-slate-50 ps-12 pe-12 text-sm text-slate-900 placeholder-slate-400 shadow-[0_1px_2px_rgba(15,23,42,0.03)] transition-all duration-200 hover:border-slate-300 focus:border-[#00298a] focus:bg-white focus:ring-4 focus:ring-[#00298a]/10 focus:outline-none"
          />
          <button
            type="button"
            aria-label="Show password"
            class="absolute inset-y-0 end-0 flex w-12 cursor-pointer items-center justify-center text-slate-400 transition-colors hover:text-[#00298a] focus:outline-none focus-visible:text-[#00298a]"
          >
            <i class="fa-regular fa-eye text-sm"></i>
          </button>
        </div>
      </div>

      <!-- Error example (show when needed) -->
      <!--
      <div class="flex items-start gap-3 rounded-xl border border-red-200 bg-red-50 p-3.5 text-sm text-red-800 shadow-sm" role="alert">
        <i class="fa-solid fa-circle-exclamation mt-0.5 text-red-500"></i>
        <p class="font-semibold leading-5">Current password is incorrect.</p>
      </div>
      -->

      <!-- Success example (show when needed) -->
      <!--
      <div class="flex items-start gap-3 rounded-xl border border-emerald-200 bg-emerald-50 p-3.5 text-sm text-emerald-800 shadow-sm" role="status">
        <i class="fa-solid fa-circle-check mt-0.5 text-emerald-500"></i>
        <p class="font-semibold leading-5">Your password was updated successfully.</p>
      </div>
      -->

      <!-- Actions -->
      <div class="flex flex-col-reverse gap-3 pt-1 sm:flex-row sm:justify-end">
        <a
          href="#"
          class="inline-flex h-[46px] items-center justify-center rounded-xl border border-slate-200 bg-white px-6 text-sm font-semibold text-slate-600 transition-all duration-200 hover:border-[#00298a]/40 hover:bg-[#00298a]/5 hover:text-[#00298a] focus:outline-none focus:ring-4 focus:ring-[#00298a]/10 active:scale-[0.98]"
        >
          Cancel
        </a>
        <button
          type="submit"
          class="group flex h-[46px] cursor-pointer items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-[#00298a] to-[#1d4ed8] px-7 text-sm font-bold text-white shadow-lg shadow-[#00298a]/25 transition-all duration-200 hover:-translate-y-0.5 hover:shadow-xl hover:shadow-[#00298a]/30 focus:outline-none focus:ring-4 focus:ring-[#00298a]/30 active:translate-y-0 active:scale-[0.98] disabled:translate-y-0 disabled:cursor-not-allowed disabled:from-slate-400 disabled:to-slate-500 disabled:shadow-none"
        >
          <i class="fa-solid fa-floppy-disk text-xs"></i>
          Update password
        </button>
      </div>
    </form>
  </article>

  <!-- Security tip -->
  <p class="mt-4 flex items-center justify-center gap-1.5 text-center text-xs text-slate-400">
    <i class="fa-solid fa-shield-halved text-[10px]"></i>
    You'll stay signed in on this device after changing your password.
  </p>
</section>
