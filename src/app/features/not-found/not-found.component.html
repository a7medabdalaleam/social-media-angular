<main
  class="relative flex min-h-screen items-center justify-center overflow-hidden bg-gradient-to-br from-[#f8faff] via-slate-50 to-[#e8efff] px-4 py-10 font-sans"
>
  <!-- Background decorations -->
  <div
    class="pointer-events-none absolute -start-40 -top-40 size-96 rounded-full bg-[#00298a]/10 blur-3xl"
    aria-hidden="true"
  ></div>
  <div
    class="pointer-events-none absolute -bottom-40 -end-40 size-96 rounded-full bg-sky-300/25 blur-3xl"
    aria-hidden="true"
  ></div>

  <section
    class="relative w-full max-w-lg rounded-3xl border border-white/80 bg-white/95 p-8 text-center shadow-[0_1px_2px_rgba(15,23,42,0.05),0_20px_60px_rgba(15,23,42,0.1)] backdrop-blur-xl sm:p-10"
  >
    <!-- Icon -->
    <span
      class="mx-auto flex size-16 items-center justify-center rounded-2xl bg-gradient-to-br from-[#00298a] to-blue-500 text-white shadow-lg shadow-[#00298a]/25"
    >
      <i class="fa-solid fa-compass text-2xl"></i>
    </span>

    <!-- 404 -->
    <h1
      class="mt-6 bg-gradient-to-r from-[#00298a] via-[#1d4ed8] to-sky-500 bg-clip-text text-8xl font-extrabold leading-none tracking-tight text-transparent sm:text-9xl"
    >
      404
    </h1>

    <span
      class="mt-5 inline-flex items-center gap-2 rounded-full bg-[#00298a]/10 px-3 py-1 text-[11px] font-bold uppercase tracking-[0.16em] text-[#00298a] rtl:tracking-normal"
    >
      <span class="size-1.5 rounded-full bg-[#00298a]"></span>
      Page not found
    </span>

    <h2 class="mt-4 text-2xl font-extrabold tracking-tight text-slate-900 rtl:tracking-normal">
      Oops! We can't find that page
    </h2>
    <p class="mx-auto mt-2 max-w-sm text-sm leading-6 text-slate-500">
      The page you're looking for might have been moved, renamed, or never existed. Let's get you
      back on track.
    </p>

    <!-- Actions -->
    <div class="mt-8 flex flex-col gap-3 sm:flex-row">
      <a
        routerLink="/timeline"
        class="group flex h-[48px] flex-1 cursor-pointer items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-[#00298a] to-[#1d4ed8] px-5 text-sm font-bold text-white shadow-lg shadow-[#00298a]/25 transition-all duration-200 hover:-translate-y-0.5 hover:shadow-xl hover:shadow-[#00298a]/30 focus:outline-none focus:ring-4 focus:ring-[#00298a]/30 active:translate-y-0 active:scale-[0.98]"
      >
        <i class="fa-solid fa-house text-xs"></i>
        Back to feed
      </a>

      <button
        type="button"
        (click)="goBack()"
        class="group flex h-[48px] flex-1 cursor-pointer items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-5 text-sm font-semibold text-[#00298a] transition-all duration-200 hover:border-[#00298a]/40 hover:bg-[#00298a]/5 focus:outline-none focus:ring-4 focus:ring-[#00298a]/10 active:scale-[0.98]"
      >
        <i
          class="fa-solid fa-arrow-left text-xs transition-transform duration-200 group-hover:-translate-x-1 rtl:rotate-180 rtl:group-hover:translate-x-1"
        ></i>
        Go back
      </button>
    </div>
  </section>
</main>
