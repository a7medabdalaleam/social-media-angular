<section
  class="rounded-3xl border border-slate-200/70 bg-slate-50/50 p-4 sm:p-5"
  aria-label="Comments"
>
  <!-- Header -->
  <div class="mb-4 flex items-center gap-2.5">
    <h3 class="text-[15px] font-bold tracking-tight text-slate-900">Comments</h3>
    <span
      class="rounded-full bg-[#00298a]/10 px-2.5 py-0.5 text-[12px] font-bold text-[#00298a] ring-1 ring-[#00298a]/10"
    >
      {{ allComments().length }}
    </span>
  </div>

  <!-- Comment -->
  @for (comment of allComments(); track comment._id) {
    <div class="group mb-5 w-full flex gap-2.5">
      <div
        class="mt-0.5 shrink-0 self-start rounded-full bg-gradient-to-br from-[#00298a] via-blue-500 to-sky-400 p-[2px]"
      >
        <img
          [src]="comment.commentCreator.photo"
          [alt]="comment.commentCreator.name"
          class="size-8 rounded-full border-2 border-white bg-slate-100 object-cover"
        />
      </div>

      <div class="flex min-w-0 flex-1 flex-col items-start">
        <div
          class="max-w-full rounded-2xl rounded-ss-md border border-slate-200/70 bg-white px-4 py-2.5 shadow-[0_1px_2px_rgba(15,23,42,0.04)] transition-shadow duration-200 hover:shadow-[0_4px_12px_rgba(15,23,42,0.06)]"
        >
          <div class="mb-0.5 flex items-center gap-1.5">
            <span
              class="cursor-pointer text-[13px] font-bold tracking-tight text-slate-900 transition-colors hover:text-[#00298a] hover:underline"
            >
              {{ comment.commentCreator.name }}
            </span>
          </div>

          <div class="mb-1.5 flex items-center gap-1.5 text-[12px] text-slate-500">
            <span class="font-medium">@{{ comment.commentCreator.username }}</span>
            <span class="text-slate-300">&middot;</span>
            <span>{{ comment.createdAt }}s</span>
          </div>

          @if (comment.content) {
            <p class="wrap-break-word text-[14px] leading-6 text-slate-700">
              {{ comment.content }}
            </p>
          }
          @if (comment.image) {
            <img [src]="comment.image" class="h-[100px]" alt="" />
          }
        </div>

        <!-- Comment actions -->
        <div class="mt-1.5 ms-2 flex items-center gap-1 text-[12px] font-semibold text-slate-500">
          <span class="px-1.5 text-slate-400">6s</span>
          <button
            class="cursor-pointer rounded-md px-2 py-0.5 transition-colors hover:bg-[#00298a]/10 hover:text-[#00298a] active:scale-95"
          >
            Like ({{ comment.likes.length }})
          </button>
          <button
            class="cursor-pointer rounded-md px-2 py-0.5 transition-colors hover:bg-[#00298a]/10 hover:text-[#00298a] active:scale-95"
          >
            Reply
          </button>
          <button
            aria-label="Comment options"
            class="flex size-6 cursor-pointer items-center justify-center rounded-full text-slate-400 opacity-0 transition-all duration-200 hover:bg-slate-200/70 hover:text-slate-700 focus:opacity-100 focus:outline-none focus:ring-2 focus:ring-[#00298a]/20 group-hover:opacity-100"
          >
            <i class="fa-solid fa-ellipsis"></i>
          </button>
        </div>
      </div>
    </div>
  }

  <!-- Create comment -->
  <div class="flex gap-2.5">
    <div
      class="mt-0.5 shrink-0 self-start rounded-full bg-gradient-to-br from-[#00298a] via-blue-500 to-sky-400 p-[2px]"
    >
      <img
        src="https://i.pravatar.cc/150?img=11"
        alt="Ahmed Menisy"
        class="size-8 rounded-full border-2 border-white bg-slate-100 object-cover"
      />
    </div>

    <div
      class="flex flex-1 flex-col rounded-2xl border border-slate-200 bg-white p-2 shadow-[0_1px_2px_rgba(15,23,42,0.04)] transition-all duration-200 hover:border-slate-300 focus-within:border-[#00298a] focus-within:ring-4 focus-within:ring-[#00298a]/10"
    >
      <textarea
        class="min-h-[60px] w-full resize-none border-none bg-transparent px-2 pb-3 pt-1 text-[14px] leading-6 text-slate-800 outline-none placeholder:text-slate-400"
        placeholder="Comment as ..."
        aria-label="Write a comment"
      ></textarea>

      <div class="flex items-center justify-between border-t border-slate-100 px-1 pt-2">
        <div class="flex items-center gap-1">
          <input type="file" id="file" class="peer hidden" />
          <label
            for="file"
            class="group/photo flex cursor-pointer items-center gap-2 rounded-lg px-2 py-1.5 text-slate-600 transition-all duration-200 hover:bg-emerald-50 hover:text-emerald-700 peer-focus-visible:ring-2 peer-focus-visible:ring-[#00298a]/30 active:scale-95"
          >
            <i
              class="fa-regular fa-image text-[1.05rem] text-emerald-500 transition-transform duration-200 group-hover/photo:scale-110"
            ></i>
            <span class="text-[13px] font-semibold">Photo/video</span>
          </label>
        </div>

        <button
          type="button"
          aria-label="Send comment"
          class="group/send flex size-9 cursor-pointer items-center justify-center rounded-full bg-gradient-to-br from-[#00298a] to-[#1d4ed8] text-white shadow-md shadow-[#00298a]/25 transition-all duration-200 hover:-translate-y-0.5 hover:shadow-lg hover:shadow-[#00298a]/30 focus:outline-none focus:ring-4 focus:ring-[#00298a]/30 active:translate-y-0 active:scale-90 disabled:cursor-not-allowed disabled:from-slate-300 disabled:to-slate-400 disabled:shadow-none"
        >
          <i
            class="fa-solid fa-paper-plane text-[13px] transition-transform duration-200 group-hover/send:translate-x-0.5 rtl:-scale-x-100"
          ></i>
        </button>
      </div>
    </div>
  </div>
</section>
